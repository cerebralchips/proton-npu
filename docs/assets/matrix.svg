<text x="63" y="57" font-size="21" fill="#ab6000" font-weight="650">Command: mmacc</text>
<text x="63" y="86" font-size="15" fill="#142b3a" font-weight="400">C[4×4] += A[4×16] × B[16×4]</text>
<text x="475" y="59" font-size="18" fill="#ab6000" font-weight="650">4×4 physical PEs · signed INT8 × INT8</text>
<text x="475" y="88" font-size="15" fill="#142b3a" font-weight="400">Four products per cell; INT32 partial sum.</text>
<text x="20" y="220" font-size="15" fill="#1764d6" font-weight="650">K 0–3</text>
