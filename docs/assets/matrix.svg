<text x="163" y="647" font-size="21" fill="#ab6000" font-weight="650">Result capture → C tile</text>
<text x="163" y="676" font-size="15" fill="#142b3a" font-weight="400">16 row-major INT32 results; CPU reads them through the AXI window</text>
<text x="145" y="743" font-size="16" fill="#142b3a" font-weight="400">Blue: packed A travels right. Amber: partial sums travel down.</text>
<text x="145" y="773" font-size="14" fill="#536979" font-weight="400">Each PE keeps a packed B weight. The controller skews inputs and advances the mesh ten times.</text>
