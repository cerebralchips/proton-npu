<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1080" role="img" aria-labelledby="title desc">
<title id="title">Proton NPU system architecture with programmable DMA</title>
<desc id="desc">Proton SDK compiles AI models for the RISC-V CPU with vector and matrix execution units. The optional DMA configuration adds a separate AXI master for copy or transpose between 16 MiB SRAM and 4 GiB simulated DDR. The CPU programs and polls DMA through AXI-Lite registers on the interconnect. Matrix tile buffers remain CPU-fed. DMA is not cache coherent; SDK DMA scheduling is not yet integrated.</desc>
<defs>
<marker markerUnits="userSpaceOnUse" id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse">
<path d="M0,0 L8,4 L0,8" fill="#1764d6"/>
</marker>
<marker markerUnits="userSpaceOnUse" id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse">
<path d="M0,0 L8,4 L0,8" fill="#087e8b"/>
</marker>
<marker markerUnits="userSpaceOnUse" id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse">
<path d="M0,0 L8,4 L0,8" fill="#ab6000"/>
</marker>
</defs>
<rect width="1000" height="1080" fill="white"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="#142b3a">
<rect x="40" y="25" width="265" height="86" rx="12" fill="#f0f5ff" stroke="#1764d6" stroke-width="1.6"/>
<text x="58" y="57" font-size="21" fill="#1764d6" font-weight="650">Proton SDK</text>
<text x="58" y="80" font-size="14" fill="#142b3a" font-weight="400">AI model → bare-metal program</text>
<text x="58" y="100" font-size="13" fill="#536979" font-weight="400">Compile with IREE + LLVM</text>
<text x="355" y="57" font-size="23" fill="#142b3a" font-weight="650">Proton NPU · DMA system view</text>
<text x="355" y="86" font-size="16" fill="#536979" font-weight="400">Optional DMA + SRAM + DDR configuration</text>
<text x="355" y="111" font-size="15" fill="#536979" font-weight="400">CPU programs transfers; DMA moves the data</text>
<rect x="40" y="175" width="265" height="188" rx="12" fill="#f0f5ff" stroke="#1764d6" stroke-width="1.6"/>
<text x="58" y="207" font-size="21" fill="#1764d6" font-weight="650">64-bit RISC-V core</text>
<text x="58" y="236" font-size="15" fill="#142b3a" font-weight="400">1 × RV64 application core</text>
<text x="58" y="259" font-size="15" fill="#142b3a" font-weight="400">Six-stage, in-order pipeline</text>
<text x="58" y="282" font-size="15" fill="#142b3a" font-weight="400">Scalar register file + caches</text>
<text x="58" y="305" font-size="15" fill="#142b3a" font-weight="400">Fetch / decode / retire</text>
<rect x="355" y="190" width="225" height="115" rx="12" fill="#f0f5ff" stroke="#1764d6" stroke-width="1.6"/>
<text x="373" y="222" font-size="21" fill="#1764d6" font-weight="650">Command router</text>
<text x="373" y="251" font-size="15" fill="#142b3a" font-weight="400">RVV → vector unit</text>
<text x="373" y="274" font-size="15" fill="#142b3a" font-weight="400">mzero / mmacc → matrix</text>
<rect x="640" y="155" width="320" height="150" rx="12" fill="#eef8f8" stroke="#087e8b" stroke-width="1.6"/>
<text x="658" y="187" font-size="21" fill="#087e8b" font-weight="650">RVV 1.0 vector unit</text>
<text x="658" y="216" font-size="15" fill="#142b3a" font-weight="400">2 vector lanes</text>
<text x="658" y="239" font-size="15" fill="#142b3a" font-weight="400">32 × 2,048-bit vector registers</text>
<text x="658" y="262" font-size="15" fill="#142b3a" font-weight="400">Vector ALU / FPU / load-store</text>
<rect x="320" y="395" width="285" height="185" rx="12" fill="#eef8f8" stroke="#087e8b" stroke-width="1.6"/>
<text x="338" y="427" font-size="21" fill="#087e8b" font-weight="650">Programmable DMA</text>
<text x="338" y="456" font-size="15" fill="#142b3a" font-weight="400">SRAM ↔ DDR copy / transpose</text>
<text x="338" y="479" font-size="15" fill="#142b3a" font-weight="400">8 / 16 / 32 / 64-bit elements</text>
<text x="338" y="502" font-size="15" fill="#142b3a" font-weight="400">2D shape + row strides</text>
<text x="338" y="525" font-size="15" fill="#142b3a" font-weight="400">One channel · poll completion</text>
<text x="338" y="561" font-size="13" fill="#536979" font-weight="400">Registers: 0xe0001000</text>
<rect x="640" y="395" width="320" height="185" rx="12" fill="#fff7e9" stroke="#ab6000" stroke-width="1.6"/>
<text x="658" y="427" font-size="21" fill="#ab6000" font-weight="650">Matrix · INT8 unit</text>
<text x="658" y="456" font-size="15" fill="#142b3a" font-weight="400">4 × 4 PEs, 4 products per PE</text>
<text x="658" y="479" font-size="15" fill="#142b3a" font-weight="400">A / BT / C local tile buffers</text>
<text x="658" y="502" font-size="15" fill="#142b3a" font-weight="400">INT32 accumulate + output</text>
<text x="658" y="525" font-size="15" fill="#142b3a" font-weight="400">CPU-fed tile buffers</text>
<text x="658" y="561" font-size="13" fill="#536979" font-weight="400">AXI target · no DMA tile access</text>
<rect x="40" y="660" width="920" height="85" rx="12" fill="#eef8f8" stroke="#087e8b" stroke-width="1.6"/>
<text x="58" y="692" font-size="21" fill="#087e8b" font-weight="650">64-bit AXI interconnect</text>
<text x="58" y="721" font-size="15" fill="#142b3a" font-weight="400">CPU + vector + DMA memory traffic · address decode to SRAM, DDR and MMIO</text>
<rect x="40" y="810" width="280" height="130" rx="12" fill="#eef8f8" stroke="#087e8b" stroke-width="1.6"/>
<text x="58" y="842" font-size="21" fill="#087e8b" font-weight="650">Internal SRAM · 16 MiB</text>
<text x="58" y="871" font-size="15" fill="#142b3a" font-weight="400">Code + working buffers</text>
<text x="58" y="894" font-size="15" fill="#142b3a" font-weight="400">DMA source or destination</text>
<text x="58" y="920" font-size="13" fill="#536979" font-weight="400">0x80000000 – 0x80ffffff</text>
<rect x="350" y="810" width="300" height="130" rx="12" fill="#eef8f8" stroke="#087e8b" stroke-width="1.6"/>
<text x="368" y="842" font-size="21" fill="#087e8b" font-weight="650">External DDR · 4 GiB</text>
<text x="368" y="871" font-size="15" fill="#142b3a" font-weight="400">Weights + transfer buffers</text>
<text x="368" y="894" font-size="15" fill="#142b3a" font-weight="400">Uncached · functional model</text>
<text x="368" y="920" font-size="13" fill="#536979" font-weight="400">0x100000000 – 0x1ffffffff</text>
<rect x="680" y="810" width="280" height="130" rx="12" fill="#eef8f8" stroke="#087e8b" stroke-width="1.6"/>
<text x="698" y="842" font-size="21" fill="#087e8b" font-weight="650">Control + UART</text>
<text x="698" y="871" font-size="15" fill="#142b3a" font-weight="400">Exit status + console</text>
<text x="698" y="894" font-size="15" fill="#142b3a" font-weight="400">Test completion + output</text>
