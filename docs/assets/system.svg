<text x="55" y="600" font-size="14" fill="#087e8b" font-weight="400">Scalar AXI</text>
<text x="55" y="621" font-size="14" fill="#087e8b" font-weight="400">loads / stores</text>
<path d="M825 305 V345 H980 V645 H930 V660" fill="none" stroke="#087e8b" stroke-width="2.5" marker-end="url(#teal)" marker-start="url(#teal)"/>
