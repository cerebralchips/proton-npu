<text text-anchor="end" x="535" y="631" font-size="13" fill="#087e8b" font-weight="400">SRAM ↔ DDR data</text>
<path d="M800 580 V660" fill="none" stroke="#087e8b" stroke-width="2.5" marker-end="url(#teal)" marker-start="url(#teal)"/>
<text x="706" y="620" font-size="13" fill="#087e8b" font-weight="400">Tile MMIO</text>
<path d="M180 745 V810" fill="none" stroke="#087e8b" stroke-width="2.5" marker-end="url(#teal)" marker-start="url(#teal)"/>
<path d="M500 745 V810" fill="none" stroke="#087e8b" stroke-width="2.5" marker-end="url(#teal)" marker-start="url(#teal)"/>
<path d="M820 745 V810" fill="none" stroke="#087e8b" stroke-width="2.5" marker-end="url(#teal)" marker-start="url(#teal)"/>
<text x="40" y="971" font-size="14" fill="#1764d6" font-weight="600">Control / programming</text>
<text x="255" y="971" font-size="14" fill="#087e8b" font-weight="600">Memory traffic</text>
<text x="420" y="971" font-size="14" fill="#ab6000" font-weight="600">Matrix commands</text>
<text x="40" y="998" font-size="13" fill="#536979" font-weight="400">DMA is not cache coherent: software owns buffers; the qualified test disables the data cache and uses fences.</text>
<text x="40" y="1019" font-size="13" fill="#536979" font-weight="400">SDK inference uses scalar + matrix; RVV codegen is disabled and DMA scheduling is pending. DDR has no physical PHY.</text>
</g>
