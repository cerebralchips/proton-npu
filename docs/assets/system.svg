<text text-anchor="end" x="360" y="609" font-size="13" fill="#1764d6" font-weight="400">CPU programs / polls</text>
<text text-anchor="end" x="360" y="631" font-size="13" fill="#1764d6" font-weight="400">AXI-Lite registers</text>
