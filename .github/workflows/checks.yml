name: Source and documentation checks
on:
  push:
    branches: [hardware]
  pull_request:
    branches: [hardware]
permissions:
  contents: read
jobs:
  source-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check source package (does not run RTL)
        run: python3 tests/repository/check.py
